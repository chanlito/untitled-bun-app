name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: nothing here writes to the repo
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Pinned, so a Bun release can't change the build under an unrelated PR
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun fmt --check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

  # Its own job: `bun lint` is only in Bun canary, which moves daily. Once it ships in a
  # stable release, fold it back into `check` on the pinned version.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint --max-warnings 0

  # The production image: it builds, migrates an empty database, reports ready, and stops
  # cleanly on SIGTERM, the way a container platform runs it (see docs/deploying.md)
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # CI only
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -h 127.0.0.1"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile's Bun matches .bun-version
        run: |
          grep -qx "ARG BUN_VERSION=$(cat .bun-version)" Dockerfile ||
            { echo "::error file=Dockerfile::ARG BUN_VERSION must equal .bun-version"; exit 1; }

      - name: Build
        run: docker build -t api .

      - name: Migrate, serve, stop
        run: |
          cat > prod.env <<ENV
          DATABASE_URL=postgres://app:app@127.0.0.1:5432/app
          API_URL=http://localhost:3141
          APP_URL=http://localhost:3142
          BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          ENV
          docker run --rm --network host --env-file prod.env api bun run db:migrate
          docker run -d --name api --network host --env-file prod.env api
          for i in $(seq 30); do curl -sf localhost:3141/ready && break; sleep 1; done
          curl -sf localhost:3141/ready
          docker stop api
          docker logs api
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0
          docker logs api | grep -q '"msg":"stopped"'
