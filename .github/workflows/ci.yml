name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary # bun lint is not in a stable release yet

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:check

      - name: Format
        run: bun run fmt:check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test
