# Weekly update PRs, minor and patch bumps grouped so they arrive as one PR per ecosystem.
# Majors come one by one. Exact pins (Drizzle RC, Better Auth) are bumped like the rest.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
